name: RAG Evaluation

# RAG Triad regression evaluation: runs the golden benchmark through the
# real pipeline (retrieval gate, DeepSeek generation, attribution checks)
# and LLM-as-a-Judge scoring, then enforces hallucination / retrieval-drift
# gates. Requires the DEEPSEEK_API_KEY repository secret; without it the
# job warns and skips (PRs from forks don't have secret access).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rag-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-minilm-${{ runner.os }}

      - name: Unit tests
        working-directory: backend
        run: pytest -q

      - name: Run RAG Triad evaluation with regression gates
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::warning::DEEPSEEK_API_KEY secret is not set — skipping RAG evaluation."
            exit 0
          fi
          python -m eval.runner --dataset eval/golden_dataset.json --gate

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-report
          path: backend/eval/eval_report.json
          if-no-files-found: ignore
